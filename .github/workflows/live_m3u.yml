name: Live M3U Checker

on:
  workflow_dispatch:     # ручной запуск
  schedule:
    - cron: "0 */6 * * *"   # каждые 6 часов

jobs:
  check-m3u:
    runs-on: ubuntu-latest

    steps:
      # ============================
      # 1. Клонируем репозиторий
      # ============================
      - name: Checkout repo
        uses: actions/checkout@v4

      # ============================
      # 2. Устанавливаем Python
      # ============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================
      # 3. Устанавливаем зависимости
      # ============================
      - name: Install dependencies
        run: |
          pip install requests

      # ============================
      # 4. Запускаем проверку плейлиста
      # ============================
      - name: Run live_m3u.py
        run: |
          python live_m3u.py \
            "https://raw.githubusercontent.com/Phoenix89S/Mir-IpTV-Ru-/main/olegPlaylistVK.m3u" \
            -o olegPlaylistVK_alive.m3u \
            -8 olegPlaylistVK_alive.m3u8 \
            -r olegPlaylistVK_report.txt

      # ============================
      # 5. Коммитим изменения
      # ============================
      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add olegPlaylistVK_alive.m3u
            git add olegPlaylistVK_alive.m3u8
            git add olegPlaylistVK_report.txt
            git commit -m "Auto-update playlist + report"
            git push
          else
            echo "No changes — nothing to commit."
          fi