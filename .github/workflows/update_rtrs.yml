name: Update RTRS IPTV Playlist

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Git Config & Pull
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main || echo "No changes"

      - name: Run RTRS Script
        run: python find_m3u8_rtrs.py

      - name: Commit and Push
        run: |
          git add Super_RTRS_2026.m3u
          git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
