Name: Update RTRS IPTV Playlist

on:
  schedule:
    # 1. Ежедневно в 03:00 МСК (00:00 UTC), КРОМЕ 1-го числа месяца
    - cron: '0 0 2-31 * *'
    
    # 2. Контрольный запуск ТОЛЬКО 1-го числа месяца в 04:00 МСК (01:00 UTC)
    - cron: '0 1 1 * *'
    
    # 3. Раз в 2 дня в 05:00 МСК (02:00 UTC), начиная со 2-го числа (чтобы не мешать 1-му)
    - cron: '0 2 2-31/2 * *'

  workflow_dispatch: # Оставляем возможность пинка вручную

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Git Config & Pull
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main || echo "No changes"

      - name: Run RTRS Script
        run: python find_m3u8_rtrs.py

      - name: Commit and Push
        run: |
          git add Super_RTRS_2026.m3u
          git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push 
