name: Update RTRS IPTV Playlist

on:
  workflow_dispatch:          # Ручной запуск из интерфейса GitHub Actions

  # ================================
  # АВТОМАТИЧЕСКИЕ ЗАПУСКИ ПО ТВОЕМУ ГРАФИКУ
  # ================================
  schedule:
    - cron: '0 0 2-31 * *'     # DAILY — каждый день, кроме 1-го числа (03:00 МСК)
                               # Запускается в 00:00 UTC, что соответствует 03:00 по МСК.
    - cron: '0 1 1 * *'        # MONTHLY — 1-го числа (04:00 МСК)
                               # Раз в месяц, для «генеральной» пересборки.
    - cron: '0 2 2-31/2 * *'   # EVERY2 — каждые 2 дня (05:00 МСК)
                               # Дополнительный режим, чтобы не отставать от изменений.

jobs:

  # ================================
  # 1) СКАЧИВАНИЕ ИСТОЧНИКОВ
  # ================================
  download_sources:
    runs-on: ubuntu-latest     # Стандартный Linux-раннер GitHub
    steps:

      # --- Клонируем репозиторий (получаем код, скрипты, структуру проекта) ---
      # Этот шаг подтягивает содержимое текущего репозитория в рабочую директорию раннера.
      - name: Checkout
        uses: actions/checkout@v4

      # --- Устанавливаем нужную версию Python для скрипта find_m3u8_rtrs.py ---
      # Важно фиксировать версию, чтобы поведение не менялось со временем.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # --- Ставим зависимости для работы с HTTP и асинхронными запросами ---
      # requests — синхронные HTTP-запросы
      # aiohttp — асинхронные HTTP-запросы, если скрипт использует asyncio
      - name: Install dependencies
        run: pip install requests aiohttp

      # --- Стадия download: собираем сырые источники (все найденные URL/потоки) ---
      # Скрипт find_m3u8_rtrs.py в режиме --stage download:
      #   - ищет доступные m3u8/потоки
      #   - формирует первичный список каналов/URL
      #   - сохраняет результат в sources_raw.m3u
      - name: Download sources
        run: python find_m3u8_rtrs.py --stage download

      # --- Сохраняем сырые источники как артефакт raw_sources (sources_raw.m3u) ---
      # Артефакт — это файл, который можно передать в другие jobs.
      # Здесь мы фиксируем результат стадии download для следующего этапа.
      - name: Upload raw sources
        uses: actions/upload-artifact@v4
        with:
          name: raw_sources       # Имя артефакта
          path: sources_raw.m3u   # Файл, который сохраняем


  # ================================
  # 2) ФИЛЬТРАЦИЯ ИСТОЧНИКОВ
  # ================================
  filter_sources:
    runs-on: ubuntu-latest
    needs: download_sources     # Ждём завершения job download_sources
    steps:

      # --- Снова клонируем репозиторий (чистая рабочая копия для этой job) ---
      # Каждая job запускается в отдельном окружении, поэтому нужен новый checkout.
      - name: Checkout
        uses: actions/checkout@v4

      # --- Поднимаем Python той же версии, что и на предыдущем этапе ---
      # Это важно для консистентности поведения скрипта.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # --- Ставим зависимости (requests, aiohttp) ---
      # Повторяем установку, т.к. окружение у каждой job своё.
      - name: Install dependencies
        run: pip install requests aiohttp

      # --- Забираем артефакт с сырыми источниками (sources_raw.m3u) ---
      # Здесь мы подтягиваем результат стадии download.
      - name: Download raw sources
        uses: actions/download-artifact@v4
        with:
          name: raw_sources       # Имя артефакта, сохранённого ранее

      # --- Стадия filter: вычищаем мусор, фейки, битые URL, лишние EXTINF ---
      # Скрипт в режиме --stage filter:
      #   - фильтрует источники по заданным критериям
      #   - убирает дубли, невалидные ссылки, лишние записи
      #   - формирует более чистый список в sources_clean.m3u
      - name: Smart filter
        run: python find_m3u8_rtrs.py --stage filter

      # --- Сохраняем очищенный список источников как clean_sources (sources_clean.m3u) ---
      # Этот артефакт пойдёт на следующую стадию проверки потоков.
      - name: Upload filtered sources
        uses: actions/upload-artifact@v4
        with:
          name: clean_sources       # Имя артефакта
          path: sources_clean.m3u   # Файл с отфильтрованными источниками


  # ================================
  # 3) ПРОВЕРКА ПОТОКОВ
  # ================================
  check_streams:
    runs-on: ubuntu-latest
    needs: filter_sources       # Ждём завершения фильтрации
    steps:

      # --- Клонируем репозиторий для этой стадии ---
      # Снова получаем код и скрипты в новое окружение.
      - name: Checkout
        uses: actions/checkout@v4

      # --- Настраиваем Python ---
      # Та же версия, чтобы не было сюрпризов.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # --- Ставим зависимости для проверки потоков ---
      # Нужны те же библиотеки, что и раньше.
      - name: Install dependencies
        run: pip install requests aiohttp

      # --- Загружаем очищенные источники (sources_clean.m3u) ---
      # Берём результат стадии filter.
      - name: Download clean sources
        uses: actions/download-artifact@v4
        with:
          name: clean_sources

      # --- Стадия check: проверяем, что потоки реально отвечают, отбрасываем мёртвые ---
      # Скрипт в режиме --stage check:
      #   - проходит по каждому источнику
      #   - проверяет доступность/ответ сервера
      #   - исключает неработающие потоки
      #   - формирует sources_checked.m3u
      - name: Check streams
        run: python find_m3u8_rtrs.py --stage check

      # --- Сохраняем проверенный список источников как checked_sources (sources_checked.m3u) ---
      # Это уже «живые» потоки, которые можно использовать для финального плейлиста.
      - name: Upload checked sources
        uses: actions/upload-artifact@v4
        with:
          name: checked_sources       # Имя артефакта
          path: sources_checked.m3u   # Файл с проверенными источниками


  # ================================
  # 4) СБОРКА ФИНАЛЬНОГО ПЛЕЙЛИСТА
  # ================================
  build_playlist:
    runs-on: ubuntu-latest
    needs: check_streams        # Ждём завершения проверки потоков
    steps:

      # --- Клонируем репозиторий для финальной сборки ---
      # Ещё одно чистое окружение для финального этапа.
      - name: Checkout
        uses: actions/checkout@v4

      # --- Настраиваем Python ---
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # --- Ставим зависимости (на случай, если логика build их использует) ---
      # Даже если build в основном работает с файлами, зависимости не помешают.
      - name: Install dependencies
        run: pip install requests aiohttp

      # --- Загружаем проверенные источники (sources_checked.m3u) ---
      # Это входные данные для финальной сборки плейлиста.
      - name: Download checked sources
        uses: actions/download-artifact@v4
        with:
          name: checked_sources

      # --- Стадия build: собираем финальный плейлист Super_RTRS_2026.m3u ---
      # Скрипт в режиме --stage build:
      #   - формирует итоговый m3u-плейлист
      #   - применяет нужный формат, группы, названия каналов и т.п.
      - name: Build final playlist
        run: python find_m3u8_rtrs.py --stage build

      # --- Сохраняем итоговый плейлист как артефакт final_playlist ---
      # Этот файл потом заберёт job commit_push и положит в репозиторий.
      - name: Upload final playlist
        uses: actions/upload-artifact@v4
        with:
          name: final_playlist        # Имя артефакта
          path: Super_RTRS_2026.m3u   # Итоговый плейлист


  # ================================
  # 5) КОММИТ И PUSH (ТОЛЬКО ЕСЛИ ЕСТЬ ИЗМЕНЕНИЯ)
  # ================================
  commit_push:
    runs-on: ubuntu-latest
    needs: build_playlist       # Ждём завершения сборки плейлиста
    steps:

      # --- Клонируем репозиторий с правами на push (через GITHUB_TOKEN) ---
      # Здесь важно указать token, чтобы git push был разрешён.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Загружаем артефакт с финальным плейлистом (final_playlist) ---
      # Забираем Super_RTRS_2026.m3u, сохранённый на предыдущем этапе.
      - name: Download final playlist
        uses: actions/download-artifact@v4
        with:
          name: final_playlist

      # --- Диагностика: выводим рекурсивно структуру файлов, чтобы увидеть, где лежит плейлист ---
      # ls -R . покажет:
      #   - какие папки созданы
      #   - где именно находится Super_RTRS_2026.m3u внутри final_playlist
      #   - есть ли вложенные директории, переименования, расширения и т.п.
      # Этот шаг нужен, чтобы один раз точно определить путь для Move playlist.
      - name: Debug artifact structure
        run: ls -R .

      # --- Пытаемся скопировать плейлист из папки артефакта в корень репозитория ---
      # Сейчас путь предполагаемый: final_playlist/Super_RTRS_2026.m3u
      # Если шаг падает с "No such file or directory" — значит, реальный путь другой.
      # После анализа вывода Debug artifact structure этот путь нужно будет скорректировать.
      - name: Move playlist
        run: cp final_playlist/Super_RTRS_2026.m3u ./Super_RTRS_2026.m3u

      # --- Проверяем, есть ли реальные изменения в файле плейлиста ---
      # Логика:
      #   1) git add Super_RTRS_2026.m3u — добавляем файл в индекс.
      #   2) git diff --cached --quiet — проверяем, есть ли изменения относительно HEAD.
      #   3) Если изменений нет — выходим с кодом 0 и не делаем коммит.
      - name: Check for changes
        run: |
          git add Super_RTRS_2026.m3u
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi

      # --- Настраиваем git-автора и создаём коммит с обновлённым плейлистом ---
      # user.email и user.name нужны, чтобы git не ругался при коммите.
      - name: Commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git commit -m "Auto-update playlist (manual/auto unified)"

      # --- Отправляем изменения в удалённый репозиторий ---
      # Если до этого шага не было ошибок — плейлист обновлён и закоммичен.
      - name: Push
        run: git push