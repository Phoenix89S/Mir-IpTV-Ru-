name: Update RTRS IPTV Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 5 */2 * *"
    - cron: "0 4 1 * *"

jobs:

  download_sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests aiohttp

      - name: Download sources
        run: python find_m3u8_rtrs.py --stage download


  filter_sources:
    runs-on: ubuntu-latest
    needs: download_sources
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Smart filter
        run: python find_m3u8_rtrs.py --stage filter


  check_streams:
    runs-on: ubuntu-latest
    needs: filter_sources
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Turbo check streams
        run: python find_m3u8_rtrs.py --stage check


  build_playlist:
    runs-on: ubuntu-latest
    needs: check_streams
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build playlist
        run: python find_m3u8_rtrs.py --stage build


  commit_push:
    runs-on: ubuntu-latest
    needs: build_playlist
    steps:
      - uses: actions/checkout@v4

      - name: Commit and Push results
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-update playlist" || echo "No changes"
          git push