name: Update RTRS IPTV Playlist

on:
  workflow_dispatch:          # Ручной запуск из интерфейса GitHub Actions

  # ================================
  # АВТОМАТИЧЕСКИЕ ЗАПУСКИ ПО ТВОЕМУ ГРАФИКУ
  # ================================
  schedule:
    - cron: '0 0 2-31 * *'     # DAILY — каждый день, кроме 1-го числа (03:00 МСК)
    - cron: '0 1 1 * *'        # MONTHLY — 1-го числа (04:00 МСК)
    - cron: '0 2 2-31/2 * *'   # EVERY2 — каждые 2 дня (05:00 МСК)

jobs:

  # ================================
  # 1) СКАЧИВАНИЕ ИСТОЧНИКОВ
  # ================================
  download_sources:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests aiohttp

      - name: Download sources
        run: python find_m3u8_rtrs.py --stage download

      - name: Upload raw sources
        uses: actions/upload-artifact@v4
        with:
          name: raw_sources
          path: sources_raw.m3u


  # ================================
  # 2) ФИЛЬТРАЦИЯ ИСТОЧНИКОВ
  # ================================
  filter_sources:
    runs-on: ubuntu-latest
    needs: download_sources
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests aiohttp

      - name: Download raw sources
        uses: actions/download-artifact@v4
        with:
          name: raw_sources

      - name: Smart filter
        run: python find_m3u8_rtrs.py --stage filter

      - name: Upload filtered sources
        uses: actions/upload-artifact@v4
        with:
          name: clean_sources
          path: sources_clean.m3u


  # ================================
  # 3) ПРОВЕРКА ПОТОКОВ
  # ================================
  check_streams:
    runs-on: ubuntu-latest
    needs: filter_sources
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests aiohttp

      - name: Download clean sources
        uses: actions/download-artifact@v4
        with:
          name: clean_sources

      - name: Check streams
        run: python find_m3u8_rtrs.py --stage check

      - name: Upload checked sources
        uses: actions/upload-artifact@v4
        with:
          name: checked_sources
          path: sources_checked.m3u


  # ================================
  # 4) СБОРКА ФИНАЛЬНОГО ПЛЕЙЛИСТА
  # ================================
  build_playlist:
    runs-on: ubuntu-latest
    needs: check_streams
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests aiohttp

      - name: Download checked sources
        uses: actions/download-artifact@v4
        with:
          name: checked_sources

      - name: Build final playlist
        run: python find_m3u8_rtrs.py --stage build

      - name: Upload final playlist
        uses: actions/upload-artifact@v4
        with:
          name: final_playlist
          path: Super_RTRS_2026.m3u


  # ================================
  # 5) КОММИТ И PUSH (С ПОЛНОЙ ЛОГИКОЙ ПАПОК OLD И ARTEFACT_SUPER)
  # ================================
  commit_push:
    runs-on: ubuntu-latest
    needs: build_playlist
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Создаём базовые папки, если отсутствуют ---
      - name: Prepare folders
        run: |
          mkdir -p Old
          mkdir -p Artefact_super

      # --- Нумерация артефактов ---
      - name: Calculate next artefact number
        id: artefact_num
        run: |
          count=$(ls Artefact_super/artefact_* 2>/dev/null | wc -l)
          next=$((count + 1))
          echo "next=$next" >> $GITHUB_OUTPUT
          mkdir -p Artefact_super/artefact_${next}

      # --- Скачиваем артефакт в новую подпапку ---
      - name: Download final playlist
        uses: actions/download-artifact@v4
        with:
          name: final_playlist
          path: Artefact_super/artefact_${{ steps.artefact_num.outputs.next }}

      # --- Архивируем старую версию плейлиста ---
      - name: Archive old playlist
        run: |
          if [ -f Super_RTRS_2026.m3u ]; then
            count_old=$(ls Old/Super_RTRS_2026_old_*.m3u 2>/dev/null | wc -l)
            next_old=$((count_old + 1))
            mv Super_RTRS_2026.m3u Old/Super_RTRS_2026_old_${next_old}.m3u
          fi

      # --- Копируем новый плейлист в корень ---
      - name: Move new playlist to root
        run: |
          cp Artefact_super/artefact_${{ steps.artefact_num.outputs.next }}/Super_RTRS_2026.m3u .

      # --- Проверяем изменения ---
      - name: Check for changes
        run: |
          git add Super_RTRS_2026.m3u
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi

      # --- Коммит ---
      - name: Commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git commit -m "Auto-update playlist (artefact + old version archive)"

      # --- Push ---
      - name: Push
        run: git push