Name: Update RTRS IPTV Playlist

on:
  schedule:
    # Оставляем твоё умное расписание (3, 4 и 5 утра), чтобы не частить
    - cron: '0 0 2-31 * *'
    - cron: '0 1 1 * *'
    - cron: '0 2 2-31/2 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run scripts
        run: |
          python find_m3u8_rtrs.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Super_RTRS_2026.m3u
          git commit -m "Update RTRS playlist $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
