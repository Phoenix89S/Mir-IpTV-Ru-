Name: Update IPTV Playlist

on:
  schedule:
    # Каждые 15 минут
    - cron: '*/15 * * * *'
    # Плюс раз в 2 дня в 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch:         # Можно запускать вручную

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run IPTV updater scripts
        run: |
          python find_m3u8_grouped.py
          python find_m3u8_stable.py

      - name: Commit & Push playlists
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Test_Channels_Mir_2026.m3u8 Mir_iptv_stable.m3u
          git commit -m "Автоматически обновлены плейлисты (Групповой и Стабильный) - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
