name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run IPTV updater script
        run: python find_m3u8_grouped.py

      - name: Commit & Push playlist
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u8
          git commit -m "Автоматически обновлён плейлист" || echo "No changes"
          git push
