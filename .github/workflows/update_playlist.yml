name: Update IPTV Playlist

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run scripts
        run: |
          python find_m3u8_grouped.py
          python find_m3u8_stable.py

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Test_Channels_Mir_2026.m3u8 Mir_iptv_stable.m3u
          git commit -m "Update playlists $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
